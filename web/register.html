<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - RoomSync</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Shared Group Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Main Centered Register Container -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">

                <!-- Brand Header -->
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none d-inline-flex align-items-center justify-content-center mb-2">
                        <i class="bi bi-door-open-fill text-primary fs-2 me-2"></i>
                        <span class="fs-3 fw-bold text-dark">RoomSync</span>
                    </a>
                    <p class="text-muted small mb-0">Create your Library Space Account</p>
                </div>

                <!-- Registration Card -->
                <div class="card card-roomsync p-4">
                    <h5 class="fw-bold mb-1">Student &amp; Staff Registration</h5>
                    <p class="text-muted small mb-4">Fill in your details below to access library room reservations.</p>

                    <form action="login.html" method="GET">
                        <div class="row g-3">
                            <!-- Full Name -->
                            <div class="col-12">
                                <label for="fullName" class="form-label fw-medium small">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="e.g. Ahmad Daniel Bin Razak" required>
                            </div>

                            <!-- Student / Staff ID -->
                            <div class="col-md-6">
                                <label for="userId" class="form-label fw-medium small">Student / Staff ID</label>
                                <input type="text" class="form-control" id="userId" placeholder="e.g. 2024123456" required>
                            </div>

                            <!-- Role -->
                            <div class="col-md-6">
                                <label for="regRole" class="form-label fw-medium small">Account Role</label>
                                <select class="form-select" id="regRole" required>
                                    <option value="student" selected>Student</option>
                                    <option value="librarian">Librarian</option>
                                </select>
                            </div>

                            <!-- University Email -->
                            <div class="col-12">
                                <label for="email" class="form-label fw-medium small">University Email</label>
                                <input type="email" class="form-control" id="email" placeholder="e.g. 2024123456@student.uitm.edu.my" required>
                            </div>

                            <!-- Faculty / Department -->
                            <div class="col-12">
                                <label for="faculty" class="form-label fw-medium small">Faculty / Department</label>
                                <input type="text" class="form-control" id="faculty" placeholder="e.g. College of Computing, Informatics and Mathematics" required>
                            </div>

                            <!-- Password -->
                            <div class="col-md-6">
                                <label for="regPassword" class="form-label fw-medium small">Password</label>
                                <input type="password" class="form-control" id="regPassword" placeholder="Create password" required>
                            </div>

                            <!-- Confirm Password -->
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-medium small">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required>
                            </div>
                        </div>

                        <!-- Terms Checkbox -->
                        <div class="form-check my-4">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label small text-muted" for="agreeTerms">
                                I agree to abide by the library study room rules and the 6-hour weekly booking quota policy.
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary-roomsync">
                                <i class="bi bi-person-plus me-1"></i> Create Account
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <p class="text-center small text-muted mb-0">
                        Already have an account?
                        <a href="login.html" class="fw-semibold text-decoration-none">Sign in here</a>
                    </p>
                </div>

                <!-- Back to Landing Page -->
                <div class="text-center mt-3">
                    <a href="index.html" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left me-1"></i> Back to Home
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <span>&copy; 2026 RoomSync - Library Space Reservation and Management System</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
