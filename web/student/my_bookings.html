<!DOCTYPE html>
<html lang="en">
<head>
    <title>RoomSync - My Bookings</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- MAIN WRAPPER -->
    <div class="wrapper">
        
        <!-- SIDEBAR (Rendered dynamically from components.js) -->
        <div id="sidebarContainer"></div>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content">
            
            <!-- TOPBAR -->
            <header class="topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light border" id="sidebarToggle" title="Toggle Sidebar">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 class="fw-bold mb-0">My Bookings Management</h5>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">
                        <i class="bi bi-person-circle me-1"></i> Student
                    </span>
                </div>
            </header>

            <!-- MY BOOKINGS CONTENT -->
            <main class="container py-4 flex-grow-1">
                
                <!-- Page Header, Quota Indicator & New Booking Button -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <div>
                        <h3 class="fw-bold mb-1 text-dark">My Bookings</h3>
                        <p class="text-muted small mb-0">View your previous and current room bookings.</p>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <div class="bg-white border rounded-3 px-3 py-2 small">
                            <span class="text-muted">Remaining Weekly Quota:</span>
                            <strong class="text-primary ms-1" id="remainingQuotaText">2.0 / 6.0 hrs</strong>
                        </div>
                        <a href="booking_form.html" class="btn btn-primary-roomsync">
                            <i class="bi bi-plus-lg me-1"></i> New Booking
                        </a>
                    </div>
                </div>

                <!-- Booking History Table Card -->
                <div class="card card-roomsync p-4">
                    <h5 class="fw-bold mb-3 text-dark">Booking History</h5>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="bookingTable">
                            <thead class="table-light">
                                <tr>
                                    <th>No.</th>
                                    <th>Room Name</th>
                                    <th>Booking Date</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Pax</th>
                                    <th>Purpose</th>
                                    <th>Status</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <!-- Populated dynamically by loadMyBookings() in script.js -->
                            <tbody id="bookingTableBody"></tbody>
                        </table>
                    </div>
                </div>

            </main>

            <!-- FOOTER -->
            <footer class="py-3 text-center">
                <div class="container">
                    <span>&copy; 2026 RoomSync - Library Space Reservation and Management System</span>
                </div>
            </footer>

        </div>
    </div>

    <!-- JAVASCRIPT SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/script.js"></script>
</body>
</html>
